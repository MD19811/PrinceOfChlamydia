<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Prince of Chlamydia</title>
    <style type="text/css">
      /* Set the background to black and center all content */
      body {
        background-color: black;
        color: white;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
         font-family: sans-serif;
      }

      /* Style for the iframe container */
      .game-container {
        position: relative;
        width: 800px;
        height: 600px;
      }

      iframe {
        border: none;
        width: 100%;
        height: 100%;
      }

      button {
        margin-top: 2px;
        padding: 5px 5px;
        cursor: pointer;
        background: #333;
        color: white;
        border: 1px solid #555;
        border-radius: 5px;
      }

      button:hover {
        background: #555;
      }
    </style>
  </head>
  <body>

    <img src="prince.jpg" width="320" height="240">

    <div class="game-container" id="game-wrapper">
      <iframe id="game-frame" src="https://princejs.com/"></iframe>

    <!-- Fullscreen Button -->
    <button onclick="openFullscreen();">Play Fullscreen</button>
       <button onclick="openbuttons();">Keyboard buttons</button>
    </div>


    <script type="text/javascript">
      var elem = document.getElementById("game-wrapper");

      function openFullscreen() {
        window.open("https://princejs.com/", "_blank");
      }
      function openbuttons() {
        window.open("help.html", "_blank");
      }




    </script>

  </body>
</html>
